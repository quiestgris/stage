name: Symfony Docker Test

on: [push]

jobs:
  symfony:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Start Docker
        run: docker compose up -d

      - name: Install dependencies
        run: docker compose exec -T composer composer install

      - name: Run Symfony checks
        run: docker compose exec -T php php bin/console about

      - name: DB Creation
        run: docker compose exec -T php php bin/console do:d:c

      - name: Migration
        run: docker compose exec -T php php bin/console do:mi:mi
      
      - name: Loading of Fixtures
        run: docker compose exec -T php php bin/console doctrine:fixtures:load

      - name: Test Case Execution
        run: docker compose exec -T php php bin/phpunit
      